[project]
name = "t6-psr-brief"
version = "0.0.1"
description = "Snapshot Notion Projects into SQLite and draft the weekly PSR briefings and minutes."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
