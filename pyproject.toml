[project]
name = "t6-notion-reports"
version = "0.0.1"
description = "Snapshot Notion Projects and Job Orders into SQLite, draft weekly PSR briefings/minutes, and generate daily shift status reports."
requires-python = ">=3.11"
# t6 is pinned to a t6-core tag (ADR 0002 rule 7).
dependencies = [
    "PyYAML>=6", "pydantic>=2", "tzdata",
    "t6[client] @ git+https://github.com/mclbautista/t6-core@f66afa98f5db57a1a85aa4e3197d01d01d065d4b",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
