# Non-secret configuration. Copy to config.yaml (mounted read-only into the container).
# Secrets go in .env, never here. Every key is validated at boot; a bad
# value fails the boot with a message naming the key.
# Quote the ids: an all-digit id is read by YAML as a number.

# Projects, Contacts and Job Orders are read through the t6 API (T6_API_URL and T6_API_SECRET in .env), so
# projects_data_source, contacts_data_source and jo_data_source are no longer used. An old config.yaml that
# still has them boots; each is ignored and logged as "config key ignored: <key>".
database_path: /app/data/psr.db

# Minutes draft (optional). With it set, `draft-mom` works. Meeting Notes: collection://22222222-2222-2222-2222-222222222222
# meeting_notes_data_source: "22222222-2222-2222-2222-222222222222"
# The MOM is paused: unless mom_enabled is true, the scheduler neither drafts the minutes after the Monday 11:00
# snapshot nor sends approved minutes.
# mom_enabled: false

# Wednesday brief (optional; leave all of these out to run snapshots only).
# When any is set, gateway_url and psr_group_chat_id are required. The secret PSR_SECRET goes in .env.
# The brief fires Wednesday 10:00 Asia/Manila (Tuesday snapshot at 23:30).
# The Master brief goes to each Person with master_brief on in the t6 API (data, not config).
# The Minutes go to the PSR group chat and topic: PSR group -1000000000001, topic 1.
# gateway_url: "http://192.0.2.10:8780"
# psr_group_chat_id: -1000000000001       # PSR group chat id (Minutes destination; dm-mode fallback for coordinators with no Telegram id)
# psr_group_topic_id: 1                    # PSR topic: Minutes go here
# cyril_contact_id: "00000000-0000-0000-0000-000000000000"   # FILL IN: the owner's page id in Contacts; private notes go only to the owner's Master brief
# Coordinator briefs: one message per coordinator, the same text in either mode.
# coordinator_brief_destination: dm        # dm (default): each coordinator's DM; channel: the chat and topic below
# coordinator_brief_chat_id: -1000000000002   # FILL IN (channel mode): the channel's chat id
# coordinator_brief_topic_id: 2              # FILL IN (channel mode, optional): the channel's topic id
# concern_dm: master                       # master (default): Concerns only in the Master brief; coordinators: each Coordinator brief also lists its own
# Coordinator delivery only; the Master brief and LLM still include every eligible project.
# Omit coordinator_recipients for all coordinators; [] disables every Coordinator brief.
# coordinator_recipients:
#   - "00000000-0000-0000-0000-000000000000"   # FILL IN: an allowed coordinator's Contacts page id
# llm_model: "anthropic/claude-haiku-4.5"   # model for the Minutes, leaves and per-project consolidation, named for the t6 API (default shown)
# pm_notes_weeks: 52                     # PM Notes older than this go to the LLM only if a block holds a future date
# lead_warning_days: 30                  # a Lead whose Playdate is less than this many days away is flagged
# leave_clash_days: 14                   # a team member's leave within this many days of a project date is a Concern
# test_banner: false                       # true adds "🧪 TEST" to every message (Nov 13 dry run)

# JO shift reports (optional). When true, the scheduler snapshots Job Orders
# and sends the 05:00, 11:30 and 19:00 reports every day, Asia/Manila. The secret SHIFT_SECRET goes in .env
# (never PSR_SECRET). gateway_url and test_banner are shared with the briefing keys above; gateway_url is
# required here, and so is at least one destination in shift_destinations. Leave shift_reports_enabled false
# (or out) and nothing is scheduled. shift_chat_id and shift_topic_id were replaced by shift_destinations
# and fail the boot if they are still here.
# shift_reports_enabled: true
# shift_destinations:                      # one list per report; every name and list is optional
#   mid:   [{chat: -1000000000001, topic: 1}]   # 11:30 report: a chat with an optional topic
#   day:   [100000001, 100000002]               # 19:00 report: a bare number is a user id (a DM)
#   night: [100000001, {chat: -1000000000001, topic: 2}]   # 05:00 report: DMs and chats can mix
# The ids above are placeholders. Put the real ids only in the deployed config.yaml. A person must have
# started the bot before a DM can reach them.
# ops_chat_id: 100000001                   # optional; where the ops alerts go (T6 API outage, masked read, undelivered); else the first chat entry of that report's list
# llm_enabled: true                       # false: no model is called (summaries show three words; a real brief says "LLM unavailable")
# shift_llm_model: "qwen/qwen3.8-27b"      # model (named for the t6 API) for the three-word task summaries (default shown).
#   It is separate from llm_model above, which the Wednesday brief, the leaves and the Minutes use. Every call requires
#   zero data retention, so pick a model the t6 API lists with it.
#   A model without one fails every call, and the report shows each Task's first three words instead.
#
#   NEXT DEPLOY (the image that adds shift_llm_model):
#   1. Leave the deployed config.yaml as it is. Its llm_model line keeps the briefing on Haiku, and the
#      summaries switch to the default above with no config change.
#   2. Only to pin or change the summary model, add shift_llm_model AFTER the new image is running.
#      An older image rejects the key as unknown and fails to boot.
#   3. Check the next shift report: the reports log line "shift slot=..." should show fallback=0, and the
#      jo_task_summaries table gets new rows (a changed model does not clear the cache, so tasks already
#      summarised keep their Haiku summary until their Task text changes).

# Names in free text (leave entries) are matched by the t6 API (person find). fuzzy_min_score, fuzzy_min_lead and
# honorifics no longer do anything, nor do digest_recipients (the Master brief readers are the master_brief Persons)
# and concern_scan (the API scans on its own): an old config.yaml that has them boots, and each is logged as
# "config key ignored: <key>".
