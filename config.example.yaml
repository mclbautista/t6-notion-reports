# Non-secret configuration. Copy to config.yaml (mounted read-only into the container).
# The secret NOTION_TOKEN goes in .env, never here. Every key is validated at boot; a bad
# value fails the boot with a message naming the key.
# Quote the ids: an all-digit id is read by YAML as a number.

projects_data_source: "00000000-0000-0000-0000-000000000000"   # FILL IN: Projects data source id
contacts_data_source: "00000000-0000-0000-0000-000000000000"   # FILL IN: Contacts data source id
database_path: /app/data/psr.db

# Job Orders (optional). Needed by `jo-snapshot`. Job Orders: collection://33333333-3333-3333-3333-333333333333
# jo_data_source: "33333333-3333-3333-3333-333333333333"

# Minutes draft (optional). With it set, the Monday 11:00 snapshot is followed by a draft page in
# Meeting Notes, and `draft-mom` works. Meeting Notes: collection://22222222-2222-2222-2222-222222222222
# meeting_notes_data_source: "22222222-2222-2222-2222-222222222222"

# Saturday briefing (optional; leave all of these out to run snapshots only).
# When any is set, gateway_url, psr_group_chat_id and cyril_contact_id are required.
# The secret PSR_SECRET goes in .env. Briefings fire Saturday 12:00 Asia/Manila (Friday snapshot at 23:30).
# The Minutes go to the same chat and topic: PSR group -1000000000001, topic 1.
# gateway_url: "http://192.0.2.10:8780"
# psr_group_chat_id: -1000000000001       # PSR group chat id (Minutes destination; fallback for coordinators with no Telegram id)
# psr_group_topic_id: 1                    # PSR topic: Minutes go here
# cyril_contact_id: "00000000-0000-0000-0000-000000000000"   # FILL IN: Cyril's page id in Contacts
# Coordinator delivery only; the digest and LLM still include every eligible project.
# Omit coordinator_recipients for all coordinators; [] disables their DMs and group fallbacks.
# coordinator_recipients:
#   - "00000000-0000-0000-0000-000000000000"   # FILL IN: an allowed coordinator's Contacts page id
# Digest delivery is independent; when omitted it defaults to cyril_contact_id.
# digest_recipients:
#   - "00000000-0000-0000-0000-000000000000"   # FILL IN: a digest recipient's Contacts page id
# llm_model: "anthropic/claude-haiku-4.5"   # OpenRouter model for the per-project consolidation (default shown)
# pm_notes_weeks: 52                     # PM Notes older than this go to the LLM only if a block holds a future date
# lead_warning_days: 30                  # a Lead whose Playdate is less than this many days away is flagged
# frameio_read_url: http://t6-frameio-worker:8791   # the Frame.io worker's read API; needs T6_FRAMEIO_READ_SECRET. Unset: no Frame.io lines
# leave_clash_days: 14                   # a team member's leave within this many days of a project date is a Concern
# concern_chronic_weeks: 4               # a Concern open longer than this many weeks gets a chronic marker
# test_banner: false                       # true adds "🧪 TEST" to every message (Nov 13 dry run)

# JO shift reports (optional). Needs jo_data_source above. When true, the scheduler snapshots Job Orders
# and sends the 05:00, 11:30 and 19:00 reports every day, Asia/Manila. The secret SHIFT_SECRET goes in .env
# (never PSR_SECRET). gateway_url and test_banner are shared with the briefing keys above; gateway_url is
# required here, and so is at least one destination in shift_destinations. Leave shift_reports_enabled false
# (or out) and nothing is scheduled. shift_chat_id and shift_topic_id were replaced by shift_destinations
# and fail the boot if they are still here.
# shift_reports_enabled: true
# shift_destinations:                      # one list per report; every name and list is optional
#   mid:   [{chat: -1000000000001, topic: 1}]   # 11:30 report: a chat with an optional topic
#   day:   [100000001, 100000002]               # 19:00 report: a bare number is a user id (a DM)
#   night: [100000001, {chat: -1000000000001, topic: 2}]   # 05:00 report: DMs and chats can mix
# The ids above are placeholders. Put the real ids only in the deployed config.yaml. A person must have
# started the bot before a DM can reach them.
# ops_chat_id: 100000001                   # optional; where the ops alert will go (later ticket)
# shift_llm_model: "qwen/qwen3.8-27b"      # OpenRouter model for the three-word task summaries (default shown).
#   It is separate from llm_model above, which only the Saturday briefing uses now. Every call requires
#   zero data retention, so pick a model with a ZDR endpoint (https://openrouter.ai/api/v1/endpoints/zdr).
#   A model without one fails every call, and the report shows each Task's first three words instead.
#
#   NEXT DEPLOY (the image that adds shift_llm_model):
#   1. Leave the deployed config.yaml as it is. Its llm_model line keeps the briefing on Haiku, and the
#      summaries switch to the default above with no config change.
#   2. Only to pin or change the summary model, add shift_llm_model AFTER the new image is running.
#      An older image rejects the key as unknown and fails to boot.
#   3. Check the next shift report: the reports log line "shift slot=..." should show fallback=0, and the
#      jo_task_summaries table gets new rows (a changed model does not clear the cache, so tasks already
#      summarised keep their Haiku summary until their Task text changes).

# People matching (optional; names in free text, such as leave entries, are matched to Contacts by Aliases,
# then a guarded fuzzy match). Defaults shown match the JO watchdog. A fuzzy match needs fuzzy_min_score or
# more and a lead of fuzzy_min_lead over the runner-up (both 0 to 100). Contacts with a TelegramUserID are
# searched first, the rest of Contacts only if none of them matches.
# fuzzy_min_score: 90
# fuzzy_min_lead: 8
# honorifics: [ate, kuya, sir]             # dropped from names before matching
