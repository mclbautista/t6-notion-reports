# Non-secret configuration. Copy to config.yaml (mounted read-only into the container).
# The secret NOTION_TOKEN goes in .env, never here. Every key is validated at boot; a bad
# value fails the boot with a message naming the key.
# Quote the ids: an all-digit id is read by YAML as a number.

projects_data_source: "00000000-0000-0000-0000-000000000000"   # FILL IN: Projects data source id
contacts_data_source: "00000000-0000-0000-0000-000000000000"   # FILL IN: Contacts data source id
database_path: /app/data/psr.db

# Job Orders (optional). Needed by `jo-snapshot`. Job Orders: collection://3d8fb4d5-9e59-8073-a0d0-000b77632947
# jo_data_source: "3d8fb4d5-9e59-8073-a0d0-000b77632947"

# Minutes draft (optional). With it set, the Monday 11:00 snapshot is followed by a draft page in
# Meeting Notes, and `draft-mom` works. Meeting Notes: collection://e77662de-dbca-47c3-80ac-355716f6fe43
# meeting_notes_data_source: "e77662de-dbca-47c3-80ac-355716f6fe43"

# Sunday briefing (optional; leave all of these out to run snapshots only).
# When any is set, gateway_url, psr_group_chat_id and cyril_contact_id are required.
# The secret PSR_SECRET goes in .env. Briefings fire Sunday 16:00 Asia/Manila.
# gateway_url: "http://192.168.88.151:8780"
# psr_group_chat_id: -1000000000000        # FILL IN: PSR group chat id (fallback for coordinators with no Telegram id)
# psr_group_topic_id: 1                    # optional topic in that group
# cyril_contact_id: "00000000-0000-0000-0000-000000000000"   # FILL IN: Cyril's page id in Contacts
# llm_model: "anthropic/claude-haiku-4.5"   # OpenRouter model for owed items (default shown)
# test_banner: false                       # true adds "🧪 TEST" to every message (Nov 13 dry run)

# JO shift reports (optional). Needs jo_data_source above. When true, the scheduler snapshots Job Orders
# and sends the 05:00, 12:00 and 18:00 reports every day, Asia/Manila. The secret SHIFT_SECRET goes in .env
# (never PSR_SECRET). gateway_url and test_banner are shared with the briefing keys above; gateway_url is
# required here, and so is shift_chat_id. Leave shift_reports_enabled false (or out) and nothing is scheduled.
# shift_reports_enabled: true
# shift_chat_id: -1000000000000            # FILL IN: chat for the reports (Cyril's DM for the dry run)
# shift_topic_id: 1                        # optional topic in that chat
# ops_chat_id: 274983989                   # optional; where the ops alert will go (later ticket)
