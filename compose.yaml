# Own compose file, separate from the gateway's. Deploy: `git pull && docker compose up -d --build`.
# Rollback: `NOTION_REPORTS_TAG=<previous> docker compose up -d` (see "Rollback" in the README).
name: t6-notion-reports
services:
  tailscale:
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_EXTRA_ARGS: --advertise-tags=tag:t6-reports
      TS_HOSTNAME: t6-reports
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - tailscale_state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
  notion-reports:
    build: .
    image: notion-reports:${NOTION_REPORTS_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
        restart: true
    volumes:
      - ./data:/app/data            # SQLite file lives here; host dir owned by uid 1001
      - ./config.yaml:/app/config.yaml:ro

volumes:
  tailscale_state:
